# Toolchain of this module, the same locally and in CI (jdx/mise-action).
# Maven 3.8: under 3.9 the jahia-maven-plugin dependency scan writes a wrong Import-Package while the
# build still ends BUILD SUCCESS. Node and Yarn for the admin screen are installed by
# frontend-maven-plugin (pom.xml).
[tools]
java = "temurin-17"
maven = "3.8.8"
