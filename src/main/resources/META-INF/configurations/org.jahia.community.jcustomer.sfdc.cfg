# default configuration
# jCustomer - Salesforce Connector - OSGi configuration
# The "# default configuration" marker above makes Jahia install this file only when the
# configuration is absent, so operator edits (e.g. jcustomer.url / credentials below) survive
# a module redeploy instead of being overwritten back to these defaults on every deploy.
# All sensitive values (private key, credentials) are stored in JCR via the admin UI.
# This file controls runtime behaviour only.

# Quartz cron — batch sync schedule (default: daily at 05:00 UTC)
scheduler.cron=0 0 5 * * ?

# Salesforce REST API version
sfdc.api.version=v66.0

# Max records per SOQL page (SF max is 2000)
sfdc.batch.size=200

# Delta sync buffer in minutes — protects against clock skew between servers
sync.delta.buffer.minutes=5

# Whether to trigger a sync immediately on user login (in addition to scheduled batch)
sync.on.login=true

# jCustomer site key used for ContextServerService calls
jcustomer.site.key=mysoprahr

# jCustomer internal URL + credentials — used for the direct REST property-type listing.
# SET THESE PER ENVIRONMENT. Do NOT commit real credentials to source control.
# Left unset on purpose: with no URL/credentials the connector falls back to the built-in
# property list (the live lookup is disabled — fail-closed). Uncomment and fill in on deploy.
# In Docker use the container name; on bare-metal use http://localhost:8181
# jcustomer.url=http://localhost:8181
# jcustomer.username=
# jcustomer.password=
